<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="og-bg" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#141a29" />
      <stop offset="50%" stop-color="#080b11" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>

    <!-- Glowing Nebulae -->
    <linearGradient id="astro-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5D01" />
      <stop offset="100%" stop-color="#FF8A00" />
    </linearGradient>

    <linearGradient id="sw-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="sw-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <filter id="og-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#og-bg)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="180" fill="#FF5D01" opacity="0.15" filter="url(#og-glow)" />
  <circle cx="1000" cy="450" r="220" fill="#6366F1" opacity="0.2" filter="url(#og-glow)" />
  <circle cx="600" cy="300" r="150" fill="#06B6D4" opacity="0.12" filter="url(#og-glow)" />

  <!-- Top Badge -->
  <g transform="translate(100, 90)">
    <rect width="360" height="42" rx="21" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" />
    <circle cx="24" cy="21" r="6" fill="#10B981" />
    <text x="42" y="27" fill="#A5B4FC" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">ASTRO 7+ &amp; 5+ • TAILWIND CSS V4</text>
  </g>

  <!-- Title & Description -->
  <text x="100" y="200" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
    Astro Swiper <tspan fill="#818CF8">Zosei</tspan>
  </text>
  
  <text x="100" y="260" fill="#E2E8F0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="600">
    The Fastest Swiper Component for Astro
  </text>

  <text x="100" y="315" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="19" font-weight="400">
    100% Declarative Props • Compound Syntax &lt;Sw&gt; • 50+ Live Demos
  </text>
  <text x="100" y="345" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="19" font-weight="400">
    Native Tailwind v4 • Intersection Observer • AI Agent Auto-Docs
  </text>

  <!-- Install Snippet Pill -->
  <g transform="translate(100, 420)">
    <rect width="440" height="60" rx="16" fill="#0A0F1D" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />
    <text x="24" y="38" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700">$</text>
    <text x="48" y="37" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="500">pnpm add astro-swiper-zosei swiper</text>
  </g>

  <!-- Feature Pill Tags -->
  <g transform="translate(100, 520)">
    <rect width="130" height="34" rx="10" fill="rgba(255, 93, 1, 0.15)" stroke="rgba(255, 93, 1, 0.3)" />
    <text x="65" y="22" fill="#FFA566" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">3D Cards</text>

    <rect x="145" width="130" height="34" rx="10" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(139, 92, 246, 0.3)" />
    <text x="210" y="22" fill="#C4B5FD" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">Coverflow</text>

    <rect x="290" width="130" height="34" rx="10" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.3)" />
    <text x="355" y="22" fill="#67E8F9" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">50+ Demos</text>
  </g>

  <!-- Hero 3D Graphic Cards Artwork on the Right -->
  <g transform="translate(860, 310)">
    <!-- Back Card (Cyan) -->
    <rect x="-140" y="-170" width="260" height="300" rx="32" fill="url(#sw-cyan)" opacity="0.6" transform="rotate(-15)" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
    
    <!-- Middle Card (Purple) -->
    <rect x="-130" y="-160" width="260" height="300" rx="32" fill="url(#sw-purple)" opacity="0.85" transform="rotate(-4)" stroke="rgba(255,255,255,0.3)" stroke-width="2" />

    <!-- Front Hero Card (Orange) -->
    <g transform="rotate(12)">
      <rect x="-120" y="-150" width="260" height="300" rx="32" fill="url(#astro-orange)" stroke="rgba(255,255,255,0.5)" stroke-width="3" />
      <rect x="-95" y="-125" width="210" height="150" rx="20" fill="rgba(0,0,0,0.3)" />
      
      <!-- Card internal mock UI -->
      <circle cx="-65" cy="-50" r="16" fill="#ffffff" opacity="0.9" />
      <rect x="-35" y="-60" width="120" height="12" rx="6" fill="#ffffff" opacity="0.9" />
      <rect x="-35" y="-40" width="80" height="8" rx="4" fill="#ffffff" opacity="0.6" />

      <!-- Slider indicator dots on hero card -->
      <circle cx="-20" cy="90" r="6" fill="#ffffff" />
      <rect x="-5" y="85" width="24" height="10" rx="5" fill="#ffffff" />
      <circle cx="35" cy="90" r="6" fill="rgba(255,255,255,0.5)" />
    </g>

    <!-- Glowing Star Accent (命星) -->
    <g transform="translate(110, -170)" filter="url(#og-glow)">
      <path d="M 0 -30 Q 0 0 30 0 Q 0 0 0 30 Q 0 0 -30 0 Q 0 0 0 -30 Z" fill="#ffffff" />
      <circle cx="0" cy="0" r="6" fill="#FF8A00" />
    </g>
  </g>
</svg>
