name: Publish Package to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Tipo de versión (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build, Test & Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build & Run Tests
        run: |
          pnpm run build
          npx playwright install --with-deps
          pnpm run test

      - name: Publish to npm (Trusted Publishing / Provenance)
        working-directory: packages/astro-swiper-zosei
        run: pnpm publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Notify on Publish Failure
        if: failure()
        run: |
          echo "::error title=NPM Publish Failed::Hubo un error al compilar, ejecutar tests o publicar en NPM. Revisa los detalles del log."
