name: CI & Build Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Build & Test Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Package
        run: pnpm run lint

      - name: Build Library & Docs
        run: pnpm run build

      - name: Run Playwright Tests
        run: |
          pnpm --filter docs exec playwright install --with-deps chromium firefox
          pnpm --filter docs test
